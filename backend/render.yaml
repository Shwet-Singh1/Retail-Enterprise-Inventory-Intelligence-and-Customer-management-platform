# Render "Blueprint" - lets you deploy this backend with one click via
# https://render.com/docs/blueprint-spec instead of clicking through the
# dashboard manually. Optional: you can also just create a Web Service by
# hand and point it at the backend/ folder.
services:
  - type: web
    name: retail-system-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false # set manually in the Render dashboard - don't commit real value
      - key: JWT_SECRET
        sync: false # set manually in the Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 10000 # Render sets its own PORT env var at runtime; this is just a default
